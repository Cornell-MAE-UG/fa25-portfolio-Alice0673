---
layout: default
---

<h1>{{ page.title }}</h1>

<p><img src="{{ page.image | relative_url }}" alt="{{ page.imagealt }}" class="project-image" /></p>

{{ content }}

<p><strong>Technologies Used</strong>: {{ page.technologies | join: ", " }}</p>

{% if page.back_link %}
  <a href="{{ page.back_link | relative_url }}">← {{ page.back_text }}</a>
{% else %}
  <a href="{{ '/projects/' | relative_url }}">← Back to Projects</a>
{% endif %}
